<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Hosting GitHub Pages</title>
    <style>
        /* CSS untuk memberikan gaya pada tampilan */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 10px;
        }

        p {
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-block;
            background-color: #d1fae5;
            color: #065f46;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2ea44f;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #22863a;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">✅ Online</div>
        <h1>Halo, Dunia! 🚀</h1>
        <p>Halaman website sederhana ini dibuat menggunakan HTML dan CSS. Jika kamu bisa melihat halaman ini secara online, berarti proses testing hosting di <strong>GitHub Pages</strong> kamu telah berhasil!</p>
        <a href="https://github.com" class="btn" target="_blank">Kembali ke GitHub</a>
    </div>

</body>
</html>
